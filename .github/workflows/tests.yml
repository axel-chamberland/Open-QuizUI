name: Tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - ".prettierrc.json"
      - ".github/workflows/tests.yml"
      - "release/**"

  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - ".prettierrc.json"
      - ".github/workflows/tests.yml"
      - "release/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Python project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Check formatting
        run: npm run format:check

      - name: Run tests and rebuild release
        run: npm run release

      - name: Check generated release files
        run: git diff --exit-code -- release/
